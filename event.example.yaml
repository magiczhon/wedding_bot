# Всё, что видят гости и команда. Скопируйте в event.yaml и заполните под своё мероприятие.
# Код менять не нужно: тексты, варианты меню, роли команды и рабочие чаты задаются здесь.

event:
  title: Свадьба Анны и Ивана
  welcome: |
    Добро пожаловать на свадебное приглашение! 🎉
    Здесь можно подтвердить присутствие, выбрать блюда и задать вопросы.
  date_time: 12 июня 2026, сбор гостей в 15:30, начало в 16:00
  place:
    name: Ресторан «Белоснежный Лебедь»
    address: г. Москва, ул. Цветочная, д. 15
    lat: 55.7558
    lon: 37.6176
    how_to_get: Парковка во дворе, от метро «Цветной бульвар» 7 минут пешком.
  dresscode: |
    Дресс-код: формальный стиль 🕴
    Цвета: пастельные тона или классический чёрный/белый.
    Никаких спортивных костюмов, пожалуйста!
  # Необязательно: если убрать, кнопка «Программа» пропадёт
  program: |
    15:30 — сбор гостей, фуршет
    16:00 — выездная регистрация
    17:00 — банкет
    23:00 — торт и завершение вечера
  rsvp_deadline: до 1 мая

rsvp:
  question: Сможете ли вы прийти?
  max_party_size: 5        # до скольких человек можно указать «вместе со мной»

menu:
  food:
    question: Что бы вы хотели из основного?
    options: [🥩 Мясо, 🐟 Рыба, 🥗 Вегетарианское]
  drink:
    question: Что бы вы хотели из напитков?
    options: [🍸 Водка, 🥃 Коньяк, 🥂 Вино белое, 🍷 Вино красное, 🧃 Безалкогольное]

# Роли команды. organizer назначается автоматически тем, кто указан в admins в config.json,
# остальные присоединяются по коду приглашения (кнопка «Приглашения команды» у организатора).
roles:
  organizer: Организатор
  couple: Молодожёны
  host: Ведущий
  decorator: Декоратор
  lighting: Светорежиссёр
  videographer: Видеограф
  photographer: Фотограф

# Какие роли видят выгрузку гостей и сводку
export_roles: [organizer, couple]

# Каналы для гостей: гость пишет — сообщение получают роли из recipients,
# ответ сотрудника (reply или «ответ N текст») уходит обратно гостю.
# broadcast_roles могут писать в канал всем гостям сразу (с подтверждением).
guest_channels:
  host:
    button: 🎤 Вопрос ведущему
    title: Ведущий
    intro: Напишите ведущему вопрос, пожелание для программы или идею для конкурса. Можно несколько сообщений, фото и файлы.
    recipients: [host]
    broadcast_roles: [host]
  feedback:
    button: ✉️ Связь с организатором
    title: Организатор
    intro: Напишите организатору и молодожёнам — вопрос, пожелание или отзыв.
    recipients: [organizer, couple]

# Рабочие чаты команды. Каждое сообщение участника получают все остальные участники чата,
# даже если они в другом мессенджере.
rooms:
  - id: team
    title: Общий чат команды
    roles: [organizer, couple, host, decorator, lighting, videographer, photographer]
  - id: host
    title: Ведущий
    roles: [organizer, couple, host]
  - id: decor
    title: Декор
    roles: [organizer, couple, decorator]
  - id: light
    title: Свет
    roles: [organizer, couple, lighting]
  - id: video
    title: Видео
    roles: [organizer, couple, videographer]
  - id: photo
    title: Фото
    roles: [organizer, couple, photographer]
